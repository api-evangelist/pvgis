aid: pvgis

name: PVGIS

description: PVGIS (Photovoltaic Geographical Information System) is a European Commission service providing free access to solar radiation and
  photovoltaic performance data worldwide. Users can input location, system parameters, and retrieve hourly, daily, monthly, and yearly solar
  irradiation, PV output, and performance metrics in various formats (CSV, JSON, PDF). The platform supports multiple PV technologies, mounting
  options, and includes tools for horizon and temperature data, aiding researchers, engineers, and policymakers in renewable energy planning and
  analysis.

